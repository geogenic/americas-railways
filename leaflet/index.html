<!DOCTYPE html>
<html>
  <head>
    <title>America's Railroads: The Big Picture</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="leaflet.css">
    <link rel="stylesheet" href="L.Control.MousePosition.css">
    <script src="leaflet.js" type="text/javascript"></script>
    <script src="L.Control.MousePosition.js" type="text/javascript"></script>
    <style>
      html, body, #map { width:100%; height:100%; margin:0; padding:0; z-index: 1; background: #262626; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="text/javascript">
      var mapExtent = [0.00000000, -4320.00000000, 7680.00000000, 0.00000000];
      var mapMinZoom = 2;
      var mapMaxZoom = 4;
      var mapMaxResolution = 1.00000000;
      var mapMinResolution = Math.pow(2, mapMaxZoom) * mapMaxResolution;
      var tileExtent = [0.00000000, -4320.00000000, 7680.00000000, 0.00000000];
      var crs = L.CRS.Simple;
      crs.transformation = new L.Transformation(1, -tileExtent[0], -1, tileExtent[3]);
      crs.scale = function(zoom) {
        return Math.pow(2, zoom) / mapMinResolution;
      };
      crs.zoom = function(scale) {
        return Math.log(scale * mapMinResolution) / Math.LN2;
      };

      var posterBounds = [
        crs.unproject(L.point(mapExtent[2], mapExtent[3])),
        crs.unproject(L.point(mapExtent[0], mapExtent[1]))
      ];

      var layer;
      
      var map = new L.Map('map', {
          maxZoom: mapMaxZoom,
          minZoom: mapMinZoom,
          crs: crs,
          maxBounds: posterBounds,
          maxBoundsViscosity: 1.0
        });
        
      layer = L.tileLayer('{z}/{x}/{y}.png', {
          minZoom: mapMinZoom, maxZoom: mapMaxZoom,
          tileSize: L.point(512, 512),
          attribution: '<a href="https://www.maptiler.com/engine/">Rendered with MapTiler Engine</a>, non-commercial use only',
          noWrap: true,
          tms: false
        }).addTo(map);
	map.fitBounds(posterBounds);	
    </script>
  </body>
</html>
